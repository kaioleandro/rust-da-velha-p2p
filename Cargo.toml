[package]
name = "jogo-da-velha-p2p"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "macros"
] }